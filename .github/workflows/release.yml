name: Release

# Push a tag like v0.1.0 to build Linux AppImages (x86_64 + aarch64) and a universal
# macOS .dmg, and attach them to a draft GitHub release. Review and publish the draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported Ubuntu: the AppImage uses the host's glibc.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macos-universal, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev librsvg2-bin libssl-dev \
            libayatana-appindicator3-dev build-essential musl-tools patchelf file libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build
        env:
          # linuxdeploy is itself an AppImage; run it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./build.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "DiskInfoRS ${GITHUB_REF_NAME#v}" --generate-notes
