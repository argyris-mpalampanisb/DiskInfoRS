name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev librsvg2-bin libssl-dev \
            libayatana-appindicator3-dev build-essential musl-tools patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Tests, svelte-check, clippy
        run: ./build.sh test

      # Exercises the real device enumeration path (sysfs / IOKit) on the runner.
      - name: Smoke test diskinfo-helper
        run: |
          set -o pipefail
          cargo build -q -p diskinfo-helper
          code=0
          target/debug/diskinfo-helper --dump > dump.json || code=$?
          if [[ $code != 0 ]]; then
            echo "::error::diskinfo-helper --dump failed (exit $code)"
            if [[ $RUNNER_OS == macOS ]]; then
              ioreg -r -c IOBlockStorageDevice -l -w0 | head -150 || true
              lldb --batch -o run -k "thread backtrace all" -k quit -- target/debug/diskinfo-helper --dump || true
            fi
            exit 1
          fi
          cat dump.json
          python3 -c "import json; d=json.load(open('dump.json')); print(len(d['disks']), 'disk(s)')"
